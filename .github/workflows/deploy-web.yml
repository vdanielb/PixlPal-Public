name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "ai/**"
      - "engine/core/**"
      - "engine/wasm/**"
      - "scripts/build-wasm.sh"
      - "Cargo.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The engine is the source of truth for pixel ops, so a deploy that
      # ships a broken engine should fail here rather than in a browser.
      - run: pnpm test:engine

      - run: pnpm build:wasm

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          packageManager: pnpm
          command: deploy
          preCommands: pnpm build

      - run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
