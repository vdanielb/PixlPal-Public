[workspace]
resolver = "2"
members = ["engine/core", "engine/wasm", "engine/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true

# Optimized-for-size profile used for WASM builds.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
