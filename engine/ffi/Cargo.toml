[package]
name = "pixelcam-engine-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI bindings for the PixlPal engine (React Native turbo module)."

[lib]
name = "pixelcam_engine_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
pixelcam-engine = { path = "../core" }
thiserror = "2"
uniffi = "0.31"

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }
