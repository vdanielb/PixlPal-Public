[package]
name = "pixelcam-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-agnostic pixel processing engine. Consumes images and declarative pipeline JSON, returns processed pixels."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
