# uniffi-bindgen-react-native configuration.
# The Rust workspace lives at the repo root; the FFI crate wraps the
# platform-agnostic engine core with UniFFI annotations.
---
name: PixelcamEngine
rust:
  directory: ../../..
  manifestPath: engine/ffi/Cargo.toml

bindings:
  ts: src/generated
  cpp: cpp/generated

android:
  # Keep the common device targets; add x86 if you need 32-bit emulators.
  targets:
    - arm64-v8a
    - armeabi-v7a
    - x86_64

ios:
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
